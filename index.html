<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>خلّ نحچي عن موقعك — Aperio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&family=Work+Sans:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--night:#1A1D22;--obsidian:#14120F;--paper:#F7F5F0;--bone:#E7E3DA;--graphite:#2B2A28;--clay:#C1592F;--clay-soft:rgba(193,89,47,0.14);--line-dark:rgba(247,245,240,0.14);--line-light:rgba(20,18,15,0.14);--ease:cubic-bezier(0.22,1,0.36,1)}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;width:100%;max-width:100%;overflow-x:hidden;overflow-x:clip;-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:pan-y;overscroll-behavior-x:none}
body{background:var(--night);color:var(--paper);font-family:'Work Sans',Tahoma,'Segoe UI',system-ui,sans-serif;font-weight:300;overflow-x:hidden;overflow-x:clip;line-height:1.6;width:100%;max-width:100%;position:relative;touch-action:pan-y;overscroll-behavior-x:none;-webkit-tap-highlight-color:transparent}
.disp{font-family:'Space Grotesk',Tahoma,'Segoe UI',system-ui,sans-serif}
.mono{font-family:'JetBrains Mono',monospace}
a{color:inherit;text-decoration:none}
::selection{background:var(--clay);color:var(--paper)}
nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:20px 48px;backdrop-filter:blur(10px);background:rgba(26,29,34,0.92);border-bottom:1px solid var(--line-dark)}
.brand{display:flex;align-items:center;gap:14px;direction:ltr}
.brand img{height:22px;width:auto}
.brand span{font-size:15px;letter-spacing:.22em;font-weight:500}
.btn-ghost{font-size:13.5px;opacity:.7;border-bottom:1px solid var(--line-dark);padding-bottom:2px;transition:opacity .3s,border-color .3s}
.btn-ghost:hover{opacity:1;border-color:var(--clay)}
.shell{max-width:1240px;margin:0 auto;padding:130px 48px 100px}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:12px;letter-spacing:.18em;opacity:.6;margin-bottom:22px;direction:ltr}
.eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--clay)}
h1{font-family:'Space Grotesk',Tahoma,'Segoe UI',system-ui,sans-serif;font-weight:300;font-size:clamp(34px,5vw,60px);line-height:1.25}
h1 em{font-style:normal;color:var(--clay)}
.sub{margin-top:20px;font-size:17px;line-height:1.8;max-width:56ch;opacity:.82}
.grid{display:grid;grid-template-columns:250px 1fr;gap:64px;margin-top:64px;align-items:start}
.top{scroll-margin-top:90px}
.steps{position:sticky;top:100px;display:flex;flex-direction:column}
.stp{display:flex;align-items:baseline;gap:14px;padding:14px 0;border:0;border-top:1px solid var(--line-dark);background:none;color:var(--paper);font:inherit;font-size:14.5px;text-align:start;cursor:pointer;opacity:.45;transition:opacity .3s var(--ease);user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.stp:last-child{border-bottom:1px solid var(--line-dark)}
.stp b{font-weight:400;font-size:12px}
.stp.dn{opacity:.75}.stp.on{opacity:1}
.stp.on b{color:var(--clay)}
.stp:disabled{cursor:default}
.mob{display:none;margin-bottom:28px}
.bar{height:2px;background:var(--line-dark)}
.bar i{display:block;height:100%;width:0;background:var(--clay);transition:width .6s var(--ease)}
.cnt{margin-top:12px;font-size:13px;opacity:.7}
@media (max-width:900px){.grid{grid-template-columns:1fr;gap:0;margin-top:44px}.steps{display:none}.mob{display:block}}
@media (max-width:720px){nav{padding:16px 24px}.shell{padding:100px 24px 70px}}
.panel{border:1px solid var(--line-dark);background:var(--obsidian);padding:48px}
@media (max-width:720px){.panel{padding:26px 20px}}
.step{animation:stepIn .6s var(--ease)}
@keyframes stepIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
.slabel{display:block;font-size:12px;letter-spacing:.18em;opacity:.5;margin-bottom:14px;direction:ltr;text-align:start}
.step h2{font-family:'Space Grotesk',Tahoma,'Segoe UI',system-ui,sans-serif;font-weight:300;font-size:clamp(26px,3vw,36px);line-height:1.35;margin-bottom:40px;outline:0}
.f{margin-bottom:32px}
.l{display:flex;justify-content:space-between;align-items:baseline;gap:14px;font-size:16px;font-weight:400;margin-bottom:12px;line-height:1.6}
.t{flex:none;font-size:11px;letter-spacing:.08em;opacity:.5;border:1px solid var(--line-dark);padding:2px 10px;border-radius:2px}
.t.r{opacity:1;border-color:var(--clay)}
input[type=text],input[type=email],input[type=tel],textarea{width:100%;font:inherit;font-size:16px;font-weight:300;color:var(--paper);background:transparent;border:1px solid var(--line-dark);border-radius:2px;padding:14px 16px;transition:border-color .3s var(--ease),background .3s var(--ease);-webkit-appearance:none;appearance:none}
input[dir=ltr]{text-align:right}
textarea{min-height:124px;resize:vertical;line-height:1.7}
::placeholder{color:var(--paper);opacity:.38}
input:focus,textarea:focus{outline:0;border-color:var(--clay);background:var(--clay-soft)}
.hint{font-size:13.5px;opacity:.55;margin-top:9px;line-height:1.7}
.err{display:none;font-size:14px;margin-top:10px;padding-inline-start:12px;border-inline-start:2px solid var(--clay)}
.f.bad .err{display:block}
.f.bad input[type=text],.f.bad textarea,.f.bad .chip span{border-color:var(--clay)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{position:relative;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.chip input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;cursor:pointer}
.chip span{display:flex;align-items:center;gap:10px;min-height:48px;padding:10px 18px;border:1px solid var(--line-dark);border-radius:2px;font-size:15.5px;transition:border-color .3s var(--ease),background .3s var(--ease)}
.chip span::before{content:'';flex:none;width:9px;height:9px;border-radius:50%;border:1px solid rgba(247,245,240,.4);transition:all .3s var(--ease)}
.chip:hover span{border-color:rgba(247,245,240,.4)}
.chip input:checked+span{border-color:var(--clay);background:var(--clay-soft)}
.chip input:checked+span::before{background:var(--clay);border-color:var(--clay)}
.chip input:focus-visible+span{outline:2px solid var(--clay);outline-offset:3px}
.oth{margin-top:12px}
.ri{display:flex;gap:10px;margin-bottom:10px}
button{font-family:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.x{flex:none;width:48px;border:1px solid var(--line-dark);background:none;color:var(--paper);font-size:22px;border-radius:2px;cursor:pointer;opacity:.6;transition:all .3s var(--ease)}
.x:hover{opacity:1;border-color:var(--clay)}
.add{background:none;border:0;border-bottom:1px solid var(--line-dark);color:var(--paper);font-size:14px;padding:8px 0;opacity:.75;cursor:pointer;transition:all .3s var(--ease);user-select:none;-webkit-user-select:none}
.add:hover{opacity:1;border-color:var(--clay)}
.ws{border:1px solid var(--line-dark);padding:24px;margin-bottom:16px}
.ws h3{font-family:'Space Grotesk',Tahoma,system-ui,sans-serif;font-weight:400;font-size:18px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center}
.ws .f{margin-bottom:22px}
.info{border-inline-start:2px solid var(--clay);padding:6px 16px;font-size:14.5px;line-height:1.8;opacity:.85}
.navrow{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:44px;padding-top:28px;border-top:1px solid var(--line-dark)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:14px 28px;border:0;border-radius:2px;font-size:14.5px;letter-spacing:.02em;font-weight:500;background:var(--paper);color:var(--obsidian);cursor:pointer;transition:transform .35s var(--ease),background .35s var(--ease),color .35s var(--ease);user-select:none;-webkit-user-select:none}
.btn:hover{background:var(--clay);color:var(--paper);transform:translateY(-2px)}
.btn.sub2{background:var(--clay);color:var(--paper)}
.btn.sub2:hover{background:var(--paper);color:var(--obsidian)}
.btn[disabled]{opacity:.55;pointer-events:none}
.back{background:none;border:0;border-bottom:1px solid var(--line-dark);color:var(--paper);font-size:14px;padding:8px 0;opacity:.7;cursor:pointer;transition:all .3s var(--ease)}
.back:hover{opacity:1;border-color:var(--clay)}
.spin{width:14px;height:14px;border:1.5px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin 1s linear infinite}
.rv{padding:22px 0;border-top:1px solid var(--line-dark)}
.rvh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.rvh h3{font-family:'Space Grotesk',Tahoma,system-ui,sans-serif;font-weight:400;font-size:18px}
.rvh button{background:none;border:0;color:var(--paper);opacity:.6;font-size:13.5px;border-bottom:1px solid var(--line-dark);cursor:pointer;padding:6px 0}
.rvh button:hover{opacity:1;border-color:var(--clay)}
.row{display:grid;grid-template-columns:minmax(120px,.4fr) 1fr;gap:16px;font-size:15px;padding:6px 0}
.row dt{opacity:.55}.row dd{white-space:pre-wrap;overflow-wrap:anywhere}
@media (max-width:600px){.row{grid-template-columns:1fr;gap:2px;padding:8px 0}}
.note{background:var(--clay-soft);border:1px solid rgba(193,89,47,.4);padding:26px;margin:36px 0 28px}
.note .mono{display:block;font-size:12px;letter-spacing:.14em;margin-bottom:14px;direction:ltr;text-align:start}
.note li{list-style:none;padding:5px 0;font-size:15px;line-height:1.8}
.note li::before{content:'·';color:var(--clay);font-weight:700;margin-inline-end:10px}
.banner{display:none;border:1px solid var(--clay);padding:16px 18px;margin-top:24px;font-size:15px;line-height:1.8}
.banner.show{display:block}
.done{text-align:center;padding:40px 0}
.stage{position:relative;width:150px;height:150px;margin:0 auto 36px;display:flex;align-items:center;justify-content:center}
.ring{position:absolute;inset:0;border:1px solid var(--line-dark);border-radius:50%;animation:spin 60s linear infinite}
.ring.r2{inset:12%;animation-duration:90s;animation-direction:reverse;opacity:.6}
.stage img{width:60%;height:60%;object-fit:contain}
.done h2{margin-bottom:18px}
.done p{max-width:46ch;margin:0 auto 14px;line-height:1.9;opacity:.85;font-size:16.5px}
a:focus-visible,button:focus-visible{outline:2px solid var(--clay);outline-offset:3px}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
.printdoc{display:none}
@page{size:A4;margin:14mm}
@media print{body{background:#fff!important;color:#14120F!important;overflow:visible!important}body>*:not(.printdoc){display:none!important}
.printdoc{display:block!important;font:400 12pt/1.9 AperioPdf,Tahoma,'Segoe UI',system-ui,sans-serif;direction:rtl;color:#14120F}
.printdoc h1{font:500 24pt/1.5 AperioPdf,Tahoma,sans-serif;margin:0 0 4pt;color:#C1592F}
.printdoc h2{font:500 15pt/1.6 AperioPdf,Tahoma,sans-serif;margin:18pt 0 4pt;break-after:avoid}
.printdoc .pr{display:grid;grid-template-columns:36% 1fr;gap:12pt;padding:5pt 0;border-top:1px solid #ccc;break-inside:avoid}
.printdoc .pr b{font-weight:500;font-size:10.5pt;opacity:.65}.printdoc .pr span{white-space:pre-wrap;overflow-wrap:anywhere}
.printdoc .ltr{direction:ltr;text-align:right}}
.panel[hidden]{display:none}
.note+.info{margin-bottom:6px}
.done .btn,.done .add{text-decoration:none}

/* iPhone / narrow-screen hardening */
.shell,.grid,.grid>*,.panel,.step,.f,.l,.ri,.chips,.chip,.row,.rv,.note,.banner,.ws{min-width:0;max-width:100%}
.l span:first-child,.l label,.hint,.err,.info,.note li,.row dd,.row dt,.sub,.cnt,.chip span,.stp span{overflow-wrap:anywhere}
.grid{grid-template-columns:250px minmax(0,1fr)}
input,textarea,button,a{max-width:100%}
nav{padding-left:max(48px,env(safe-area-inset-left));padding-right:max(48px,env(safe-area-inset-right))}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:720px){
 nav{padding:14px max(16px,env(safe-area-inset-right)) 14px max(16px,env(safe-area-inset-left))}
 .shell{padding:92px max(16px,env(safe-area-inset-right)) 60px max(16px,env(safe-area-inset-left))}
 .panel{padding:24px 16px}
 .navrow{flex-wrap:wrap}
 .ws{padding:16px}
 .done .chips .btn{flex:1 1 100%}
 .sub{font-size:16px}
}
@media (max-width:360px){.chip span{padding:10px 14px;font-size:15px}.btn{padding:14px 20px}}
</style>

// values & validation
function val(f){const k=f.k;
 if(f.type==='list')return $$(`[data-list="${k}"]`).map(i=>i.value.trim()).filter(Boolean);
 if(f.type==='multi'){const o=$(`#o_${k}`)?.value.trim();return $$(`input[name="${k}"]:checked`).map(i=>i.value==='أخرى'?(o?'أخرى: '+o:'أخرى'):i.value)}
 if(f.type==='radio')return $(`input[name="${k}"]:checked`)?.value||'';
 if(f.type==='check')return $(`#i_${k}`).checked;
 if(f.type==='ws')return $('#wsBox').hidden?[]:$$('#wsBox .ws').map(b=>Object.fromEntries(WS.map(([k])=>[k,$(`[name="${k}"]`,b).value.trim()]))).filter(o=>Object.values(o).some(Boolean));
 if(f.type==='info')return '';
 const v=$(`#i_${k}`).value.trim();return f.type==='tel'?AR(v):v}
function err(f){const v=val(f),empty=!v||(Array.isArray(v)&&!v.length);
 if(f.req&&empty)return f.type==='check'?'لازم توافق حتى نكدر نستلم طلبك.':'هذا الحقل مطلوب.';
 if(f.type==='email'&&v&&!EM.test(v))return 'اكتب بريد إلكتروني صحيح، مثال: name@example.com';
 if(f.type==='tel'&&v&&!PH.test(v.replace(/[\s\-().]/g,'')))return 'اكتب رقماً صحيحاً، مثال: 07701234567 أو +9647701234567';
 if(f.kind==='url'&&v.some(u=>!okUrl(u)))return 'واحد من الروابط مو صحيح، تأكد منه.';
 return ''}
